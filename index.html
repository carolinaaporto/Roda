<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ec">
  <title>Roda — roupa em movimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f5f3ec;--ink:#252820;--muted:#77796f;--line:#deded4;--green:#315e48;--pale:#e4ebe2;--orange:#d96c48;--white:#fffefa;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans)}button,input,select{font:inherit}button{color:inherit;cursor:pointer}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 5.5%;border-bottom:1px solid var(--line);background:#fffefaD9}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:white;font:italic 21px var(--serif)}.brand-name{font:600 23px var(--serif)}.brand-note{margin-left:5px;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:18px}.text-link{border:0;background:none;color:var(--muted)}.profile{display:flex;align-items:center;gap:9px;border-left:1px solid var(--line);padding-left:18px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#ead9c7;color:#624c3e;font-weight:600}
    .layout{max-width:1440px;margin:auto;padding:34px 5.5% 60px;display:grid;grid-template-columns:206px minmax(0,1fr);gap:48px}aside{padding-top:5px}.nav-label{color:#929389;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 13px 12px}.nav-list{display:grid;gap:5px;margin-bottom:32px}.nav-button{width:100%;border:0;background:transparent;padding:11px 12px;display:flex;align-items:center;gap:12px;text-align:left;color:#62655d;border-radius:5px}.nav-button:hover{background:#ebeae2}.nav-button.active{background:var(--pale);color:var(--green);font-weight:700}.nav-button svg{width:17px;height:17px;flex:none;stroke:currentColor}.nav-count{margin-left:auto;font-size:11px;color:var(--muted)}.aside-note{padding:18px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.6}.aside-note strong{display:block;color:var(--green);font:500 16px var(--serif);margin-bottom:4px}main{min-width:0}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 27px}.eyebrow{margin:0 0 8px;color:var(--orange);font-size:10px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}h1{font:500 36px/1.15 var(--serif);margin:0}.subtitle{color:var(--muted);margin:9px 0 0}.primary{border:0;border-radius:4px;background:var(--green);color:white;padding:12px 17px;display:inline-flex;align-items:center;gap:9px;font-weight:600;transition:.18s}.primary:hover{background:#244a37;transform:translateY(-1px)}.primary svg{width:16px;height:16px;stroke:currentColor}
    .feature{min-height:218px;display:grid;grid-template-columns:1.07fr .93fr;overflow:hidden;margin-bottom:32px;background:#dce4d8}.feature-copy{padding:29px 30px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.feature-copy .eyebrow{color:var(--green)}.feature h2{max-width:370px;font:500 29px/1.2 var(--serif);margin:0 0 9px}.feature p:not(.eyebrow){color:#5e695f;margin:0 0 17px;font-size:13px}.feature-link{background:none;border:0;color:var(--green);padding:0;font-weight:700}.feature-image{min-height:218px;background:linear-gradient(90deg,#dce4d8,transparent 35%),url('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1100&q=85') center 42%/cover}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.search{width:min(310px,55%);position:relative}.search svg{position:absolute;left:12px;top:11px;width:17px;height:17px;stroke:#85877d}.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:4px;outline:0;background:var(--white);padding:0 12px 0 38px}.search input:focus,.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 2px #315e481c}.sort-select{height:40px;border:1px solid var(--line);border-radius:4px;color:#66685e;background:var(--white);padding:0 11px}.category-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none}.category{flex:none;border:1px solid var(--line);background:transparent;padding:8px 13px;border-radius:99px;color:#64665e;font-size:12px}.category:hover,.category.selected{border-color:var(--green);color:var(--green);background:var(--pale)}.section-title{display:flex;align-items:baseline;gap:10px;margin:0 0 15px;font:500 20px var(--serif)}.section-title span{color:var(--muted);font:400 12px var(--sans)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 17px}.product{min-width:0;animation:appear .35s both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.photo{position:relative;aspect-ratio:4/4.65;overflow:hidden;background:#e9e6dc}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}.product:hover .photo img{transform:scale(1.035)}.condition{position:absolute;left:10px;top:10px;padding:6px 8px;background:#fffefaeF;color:#55594f;font-size:10px;border-radius:2px}.heart{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:#fffefaeF;color:#55594f}.heart svg{width:17px;height:17px;stroke:currentColor}.heart.saved{color:var(--orange)}.info{padding-top:10px}.title{display:flex;justify-content:space-between;align-items:baseline;gap:7px;font-weight:600}.title span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size{color:var(--muted);font-size:11px;white-space:nowrap}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}.owner{display:flex;align-items:center;gap:6px}.dot{width:18px;height:18px;display:inline-grid;place-items:center;border-radius:50%;background:#e5d5c8;color:#6f5041;font-size:9px}.swap{width:100%;border:1px solid var(--green);background:transparent;color:var(--green);border-radius:3px;padding:9px;margin-top:11px;font-weight:600;font-size:12px}.swap:hover{background:var(--green);color:white}.swap:disabled{border-color:var(--line);color:var(--muted);background:#eeede7;cursor:default}.empty{padding:45px 20px;text-align:center;color:var(--muted);border:1px dashed #c9c9bf;grid-column:1/-1}.empty strong{display:block;color:var(--ink);font:500 21px var(--serif);margin-bottom:8px}.request-row{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);padding:16px 0}.request-row img{width:68px;height:76px;object-fit:cover;background:#e9e6dc}.request-copy{flex:1;min-width:0}.request-copy strong{display:block;margin-bottom:5px}.request-copy span{color:var(--muted);font-size:12px}.status{color:#956238;background:#f0e8d9;padding:6px 9px;font-size:11px;border-radius:2px}
    .backdrop{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:18px;background:#1c201b73}.backdrop.open{display:grid;animation:fade .18s both}@keyframes fade{from{opacity:0}to{opacity:1}}.modal{width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--white);padding:27px;box-shadow:0 15px 60px #1113}.modal-head{display:flex;justify-content:space-between;margin-bottom:21px}.modal h2{margin:0;font:500 26px var(--serif)}.modal-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.close{border:0;background:none;padding:4px;color:var(--muted);font-size:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:#565950;font-size:12px;font-weight:600}.field input,.field select{width:100%;height:41px;border:1px solid var(--line);border-radius:3px;background:white;outline:0;padding:0 10px}.submit{width:100%;justify-content:center;margin-top:19px}.toast{position:fixed;z-index:8;right:24px;bottom:24px;background:#252820;color:white;padding:13px 17px;box-shadow:0 5px 20px #0002;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.mobile-nav{display:none}
    @media(max-width:900px){.layout{padding-left:4%;padding-right:4%;grid-template-columns:170px minmax(0,1fr);gap:27px}.topbar{padding:0 4%}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.feature{grid-template-columns:1fr .8fr}}
    @media(max-width:620px){.topbar{height:63px;padding:0 18px}.brand-note,.top-actions .text-link,.profile-name{display:none}.profile{padding-left:12px}.layout{display:block;padding:25px 18px 90px}aside{display:none}.page-head{align-items:center;margin-bottom:20px}h1{font-size:29px}.subtitle{font-size:12px}.page-head>.primary{width:42px;height:42px;padding:0;justify-content:center;font-size:0}.page-head>.primary svg{width:19px;height:19px}.feature{min-height:185px;grid-template-columns:1.2fr .8fr;margin-bottom:25px}.feature-copy{padding:19px 14px}.feature h2{font-size:22px}.feature p:not(.eyebrow){font-size:11px}.feature-image{min-height:185px}.toolbar{gap:8px}.search{width:100%}.sort-select{max-width:120px}.grid{gap:20px 12px}.photo{aspect-ratio:4/4.8}.title{font-size:12px}.meta{font-size:10px}.mobile-nav{position:fixed;display:flex;z-index:3;left:0;right:0;bottom:0;justify-content:space-around;padding:9px 7px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--white)}.mobile-nav .nav-button{width:auto;display:grid;gap:3px;justify-items:center;padding:6px 13px;font-size:10px}.mobile-nav .nav-button svg{width:18px;height:18px}.mobile-nav .nav-count{display:none}.request-row{gap:10px}.status{font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="#" aria-label="Roda, página inicial"><span class="mark">r</span><span class="brand-name">roda</span><span class="brand-note">roupa em movimento</span></a><div class="top-actions"><button class="text-link" data-view-link="requests">Minhas trocas</button><div class="profile"><span class="avatar">C</span><span class="profile-name">Camila</span></div></div></header>
  <div class="layout"><aside><p class="nav-label">Seu espaço</p><nav class="nav-list" aria-label="Navegação principal"><button class="nav-button active" data-view="explore"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 4 4"/></svg>Explorar</button><button class="nav-button" data-view="closet"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M7 4h10l2 17H5L7 4Z"/><path d="M9 4a3 3 0 0 1 6 0"/></svg>Minhas peças<span class="nav-count" id="closet-count">0</span></button><button class="nav-button" data-view="requests"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"/></svg>Pedidos<span class="nav-count" id="request-count">0</span></button><button class="nav-button" data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M20.8 8.8c0 5-8.8 10-8.8 10s-8.8-5-8.8-10A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z"/></svg>Favoritas</button></nav><p class="nav-label">Categorias</p><nav class="nav-list" aria-label="Categorias"><button class="nav-button category-nav" data-category="Tudo">Tudo</button><button class="nav-button category-nav" data-category="Roupas">Roupas</button><button class="nav-button category-nav" data-category="Sapatos">Sapatos</button><button class="nav-button category-nav" data-category="Acessórios">Acessórios</button></nav><div class="aside-note"><strong>Vista de novo.</strong>Cada troca é uma peça a menos parada no armário e uma história que continua.</div></aside><main id="main-content"></main></div>
  <nav class="mobile-nav" aria-label="Navegação móvel"><button class="nav-button active" data-view="explore"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 4 4"/></svg>Explorar</button><button class="nav-button" data-view="closet"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M7 4h10l2 17H5L7 4Z"/></svg>Minhas peças</button><button class="nav-button" data-view="requests"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"/></svg>Pedidos</button><button class="nav-button" data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M20.8 8.8c0 5-8.8 10-8.8 10s-8.8-5-8.8-10A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z"/></svg>Favoritas</button></nav>
  <div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title"><form class="modal" id="item-form"><div class="modal-head"><div><h2 id="modal-title">Coloque pra rodar</h2><p>Uma peça no seu armário pode ser o achado de alguém.</p></div><button class="close" type="button" aria-label="Fechar">×</button></div><div class="fields"><div class="field full"><label for="item-name">Nome da peça</label><input id="item-name" name="name" placeholder="Ex.: Jaqueta jeans vintage" required maxlength="60"></div><div class="field"><label for="item-category">Categoria</label><select id="item-category" name="category"><option>Roupas</option><option>Sapatos</option><option>Acessórios</option></select></div><div class="field"><label for="item-size">Tamanho</label><select id="item-size" name="size"><option>PP</option><option selected>P</option><option>M</option><option>G</option><option>GG</option><option>Único</option><option>38</option><option>39</option><option>40</option></select></div><div class="field"><label for="item-condition">Estado</label><select id="item-condition" name="condition"><option>Como novo</option><option>Muito bom</option><option>Bom</option></select></div><div class="field"><label for="item-city">Cidade</label><input id="item-city" name="city" placeholder="Ex.: São Paulo" required maxlength="40"></div><div class="field full"><label for="item-image">Link de uma foto (opcional)</label><input id="item-image" name="image" type="url" placeholder="https://"></div></div><button class="primary submit" type="submit">Publicar peça</button></form></div><div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script>
    const starter=[
      {id:'a1',name:'Trench coat clássico',category:'Roupas',size:'M',condition:'Como novo',city:'Pinheiros, SP',owner:'Lia',image:'https://images.unsplash.com/photo-1539533018447-63fcce2678e3?auto=format&fit=crop&w=800&q=85'},
      {id:'a2',name:'Bolsa tiracolo de couro',category:'Acessórios',size:'Único',condition:'Muito bom',city:'Vila Madalena, SP',owner:'Marina',image:'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=85'},
      {id:'a3',name:'Camisa de linho',category:'Roupas',size:'P',condition:'Como novo',city:'Pinheiros, SP',owner:'Joana',image:'https://images.unsplash.com/photo-1598554747436-c9293d6a588f?auto=format&fit=crop&w=800&q=85'},
      {id:'a4',name:'Tênis retrô',category:'Sapatos',size:'38',condition:'Bom',city:'Centro, SP',owner:'Bia',image:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=85'},
      {id:'a5',name:'Vestido floral midi',category:'Roupas',size:'M',condition:'Muito bom',city:'Vila Mariana, SP',owner:'Nina',image:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=800&q=85'},
      {id:'a6',name:'Óculos de sol tartaruga',category:'Acessórios',size:'Único',condition:'Como novo',city:'Moema, SP',owner:'Clara',image:'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=85'}
    ];
    const stored=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
    let myItems=stored('roda-my-items',[]),requests=stored('roda-requests',[]),saved=stored('roda-saved',[]),view='explore',category='Tudo',term='',sort='recent';
    const main=document.querySelector('#main-content'), all=()=>[...starter,...myItems];
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function persist(){localStorage.setItem('roda-my-items',JSON.stringify(myItems));localStorage.setItem('roda-requests',JSON.stringify(requests));localStorage.setItem('roda-saved',JSON.stringify(saved))}
    function toast(message){const node=document.querySelector('#toast');node.textContent=message;node.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),2600)}
    function nav(){document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));document.querySelector('#closet-count').textContent=myItems.length;document.querySelector('#request-count').textContent=requests.length}
    function card(item,own=false){const liked=saved.includes(item.id),asked=requests.some(request=>request.itemId===item.id);return `<article class="product"><div class="photo"><img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80'"><span class="condition">${esc(item.condition)}</span>${own?'':`<button class="heart ${liked?'saved':''}" data-save="${esc(item.id)}" aria-label="${liked?'Remover dos favoritos':'Salvar nos favoritos'}" title="${liked?'Remover dos favoritos':'Salvar nos favoritos'}"><svg viewBox="0 0 24 24" fill="${liked?'currentColor':'none'}" stroke-width="1.7"><path d="M20.8 8.8c0 5-8.8 10-8.8 10s-8.8-5-8.8-10A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 8.8 2.8Z"/></svg></button>`}</div><div class="info"><div class="title"><span>${esc(item.name)}</span><span class="size">Tam. ${esc(item.size)}</span></div><div class="meta"><span class="owner"><span class="dot">${esc((item.owner||'C')[0])}</span>${esc(item.owner||'Camila')}</span><span>${esc(item.city)}</span></div>${own?'<button class="swap" disabled>Sua peça</button>':`<button class="swap" data-swap="${esc(item.id)}" ${asked?'disabled':''}>${asked?'Pedido enviado':'Propor troca'}</button>`}</div></article>`}
    const empty=(title,text,extra='')=>`<div class="empty"><strong>${title}</strong>${text}${extra}</div>`;
    function render(){nav();const header=`<div class="page-head"><div><p class="eyebrow">Moda circular, do seu jeito</p><h1>Peças boas merecem<br>outra história.</h1><p class="subtitle">Encontre algo novo. Dê vida ao que já tem.</p></div><button class="primary" data-add><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Anunciar peça</button></div><section class="feature"><div class="feature-copy"><p class="eyebrow">O ciclo fica melhor junto</p><h2>Seu próximo achado já existe no armário de alguém.</h2><p>Troque, descubra, repita. Sem dinheiro no meio.</p><button class="feature-link" data-scroll>Ver peças disponíveis →</button></div><div class="feature-image" role="img" aria-label="Pessoas escolhendo roupas em um brechó"></div></section><div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 4 4"/></svg><input id="search" type="search" placeholder="Buscar peças, tamanhos..." value="${esc(term)}" aria-label="Buscar peças"></label><select class="sort-select" id="sort" aria-label="Ordenar peças"><option value="recent" ${sort==='recent'?'selected':''}>Recentes</option><option value="name" ${sort==='name'?'selected':''}>Nome A–Z</option></select></div><div class="category-row">${['Tudo','Roupas','Sapatos','Acessórios'].map(name=>`<button class="category ${category===name?'selected':''}" data-category="${name}">${name}</button>`).join('')}</div><h2 class="section-title" id="catalog-title">Pra circular <span id="count"></span></h2>`;
      if(view==='explore'){const items=all().filter(item=>(category==='Tudo'||item.category===category)&&`${item.name} ${item.size} ${item.city}`.toLowerCase().includes(term.toLowerCase())).sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'pt-BR'):(myItems.includes(b)?1:0)-(myItems.includes(a)?1:0));main.innerHTML=`${header}<div class="grid">${items.length?items.map(item=>card(item,myItems.some(own=>own.id===item.id))).join(''):empty('Nada por aqui ainda','Tente outra busca ou categoria.')}</div>`;main.querySelector('#count').textContent=`${items.length} ${items.length===1?'peça':'peças'}`;main.querySelector('#search').addEventListener('input',event=>{term=event.target.value;const pos=event.target.selectionStart;render();const input=main.querySelector('#search');input.focus();input.setSelectionRange(pos,pos)});main.querySelector('#sort').addEventListener('change',event=>{sort=event.target.value;render()});return}
      if(view==='closet'){main.innerHTML=`<div class="page-head"><div><p class="eyebrow">Seu espaço</p><h1>Minhas peças</h1><p class="subtitle">${myItems.length?'O que você colocou pra circular.':'Comece com uma peça que merece outra história.'}</p></div><button class="primary" data-add><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Anunciar peça</button></div><div class="grid">${myItems.length?myItems.map(item=>card(item,true)).join(''):empty('Seu armário começa aqui','Anuncie uma peça e encontre uma nova dona.','<button class="primary" data-add style="margin-top:16px">Anunciar primeira peça</button>')}</div>`;return}
      if(view==='saved'){const items=all().filter(item=>saved.includes(item.id));main.innerHTML=`<div class="page-head"><div><p class="eyebrow">Pra não perder de vista</p><h1>Favoritas</h1><p class="subtitle">Peças que chamaram sua atenção.</p></div></div><div class="grid">${items.length?items.map(item=>card(item,myItems.includes(item))).join(''):empty('Ainda sem favoritas','Toque no coração de uma peça para guardá-la.')}</div>`;return}
      const rows=requests.map(request=>{const item=all().find(entry=>entry.id===request.itemId);return item?`<article class="request-row"><img src="${esc(item.image)}" alt="${esc(item.name)}"><div class="request-copy"><strong>${esc(item.name)}</strong><span>Pedido enviado para ${esc(item.owner||'a pessoa anunciante')}</span></div><span class="status">Aguardando resposta</span></article>`:''}).join('');main.innerHTML=`<div class="page-head"><div><p class="eyebrow">A conversa começa aqui</p><h1>Minhas trocas</h1><p class="subtitle">Acompanhe as peças que você quer trazer pro seu armário.</p></div></div>${rows||empty('Nenhuma troca por enquanto','Explore o catálogo e proponha uma troca.')}`}
    document.addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(button){view=button.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'});return}const link=event.target.closest('[data-view-link]');if(link){view=link.dataset.viewLink;render();return}const cat=event.target.closest('[data-category]');if(cat){category=cat.dataset.category;view='explore';render();return}if(event.target.closest('[data-add]')){document.querySelector('#backdrop').classList.add('open');document.querySelector('#item-name').focus();return}if(event.target.closest('[data-scroll]')){document.querySelector('#catalog-title')?.scrollIntoView({behavior:'smooth'});return}const swap=event.target.closest('[data-swap]');if(swap){requests.push({itemId:swap.dataset.swap,createdAt:Date.now()});persist();render();toast('Pedido de troca enviado. Que comece a conversa!');return}const heart=event.target.closest('[data-save]');if(heart){const id=heart.dataset.save;saved=saved.includes(id)?saved.filter(item=>item!==id):[...saved,id];persist();render();toast(saved.includes(id)?'Peça salva nas favoritas.':'Peça removida das favoritas.');return}if(event.target.closest('.close')||event.target.id==='backdrop')document.querySelector('#backdrop').classList.remove('open')});
    document.querySelector('#item-form').addEventListener('submit',event=>{event.preventDefault();const form=new FormData(event.currentTarget),image=String(form.get('image')).trim();myItems.unshift({id:`mine-${Date.now()}`,name:String(form.get('name')).trim(),category:String(form.get('category')),size:String(form.get('size')),condition:String(form.get('condition')),city:String(form.get('city')).trim(),owner:'Camila',image:image||'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=85'});persist();event.currentTarget.reset();document.querySelector('#backdrop').classList.remove('open');view='closet';render();toast('Sua peça já está circulando.')});document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelector('#backdrop').classList.remove('open')});render();
  </script>
</body>
